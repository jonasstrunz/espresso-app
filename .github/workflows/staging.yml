name: Staging Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
  workflow_dispatch:

# Single shared staging environment: serialize runs so the database reset and
# the VM deployment from concurrent pushes can never overlap.
concurrency:
  group: staging-environment
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_YES: 'true' # auto-confirm CLI prompts so CI never hangs
      STAGING_BRANCH: ${{ vars.STAGING_BRANCH || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve staging branch credentials
        # Exports POSTGRES_URL, POSTGRES_URL_NON_POOLING, SUPABASE_URL,
        # SUPABASE_JWT_SECRET and SUPABASE_<KEY_NAME> keys of the persistent
        # staging branch into the job environment.
        run: supabase --experimental branches get "$STAGING_BRANCH" -o env >> "$GITHUB_ENV"

      - name: Ensure psql is available
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Reset staging database
        run: psql "$POSTGRES_URL_NON_POOLING" -v ON_ERROR_STOP=1 -f supabase/staging/reset.sql

      - name: Push migrations to staging branch
        run: supabase db push --db-url "$POSTGRES_URL_NON_POOLING" --include-all

      - name: Apply Data API grants
        run: psql "$POSTGRES_URL_NON_POOLING" -v ON_ERROR_STOP=1 -f supabase/staging/grants.sql

      - name: Seed staging data
        run: psql "$POSTGRES_URL_NON_POOLING" -v ON_ERROR_STOP=1 -f supabase/staging/seed.sql

      - name: Build web application (Staging static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy files to VM staging path via SSH/SCP
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_SSH_HOST }}
          USER: ${{ secrets.VM_SSH_USER }}
          PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          TARGET: ${{ secrets.VM_STAGING_DEPLOY_PATH || '~/espresso-app-staging' }}
        run: |
          if [ -z "$TARGET" ] || [ "$TARGET" = "/" ] || [ "$TARGET" = "~" ]; then
            echo "Refusing to deploy to unsafe target '$TARGET'"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          # Clear the target's *contents* (keeping the directory itself) so no
          # stale hashed build assets survive a redeploy. The directory must not
          # be deleted and recreated: nginx bind-mounts it and would keep
          # serving the detached old inode.
          ssh -p "$PORT" -i ~/.ssh/id_rsa "$USER@$HOST" "mkdir -p $TARGET && rm -rf $TARGET/*"

          scp -P "$PORT" -i ~/.ssh/id_rsa -r out/* "$USER@$HOST:$TARGET/"
          echo "Staging deployment successful to $USER@$HOST:$TARGET"
