name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Build & Lint Check
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'


      - name: Install dependencies
        run: npm ci

      - name: Build web application (Static Export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Archive build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/

  # 2. Supabase Migrations Deploy
  deploy-supabase:
    name: Deploy Supabase Migrations
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Migrations to Supabase Database
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "Using direct database connection URI for migration push..."
            supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all
          else
            echo "Using Supabase Management API link..."
            supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
            supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}




  # 3. Deploy Web Frontend to VM via SSH
  deploy-vm:
    name: Deploy to VM via SSH
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: out/

      - name: Deploy files to VM using standard SSH/SCP
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_SSH_HOST }}
          USER: ${{ secrets.VM_SSH_USER }}
          PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          TARGET: ${{ secrets.VM_DEPLOY_PATH || '~/espresso-app' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          # Ensure target directory exists on remote server
          ssh -p "$PORT" -i ~/.ssh/id_rsa "$USER@$HOST" "mkdir -p '$TARGET'"

          # Securely copy files
          scp -P "$PORT" -i ~/.ssh/id_rsa -r out/* "$USER@$HOST:$TARGET/"
          echo "Deployment successful to $USER@$HOST:$TARGET"



