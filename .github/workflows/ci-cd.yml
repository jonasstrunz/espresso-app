name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Build & Lint Check
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application (Static Export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}


      - name: Archive build artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/

  # 2. Supabase Migrations Deploy
  deploy-supabase:
    name: Deploy Supabase Migrations
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations to Supabase Cloud
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # 3. Deploy Web Frontend to VM via SSH
  deploy-vm:
    name: Deploy to VM via SSH
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VM_SSH_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: out/

      - name: Deploy to VM via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "out/"
          REMOTE_HOST: ${{ secrets.VM_SSH_HOST }}
          REMOTE_USER: ${{ secrets.VM_SSH_USER }}
          REMOTE_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          TARGET: ${{ secrets.VM_DEPLOY_PATH || '/var/www/espresso-app' }}
          SCRIPT_AFTER: |
            echo "Deployment completed successfully on $(hostname) at $(date)"
